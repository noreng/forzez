<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spoked-wheel roof</title>
<!-- Snapshot of an inline claude.ai chat widget (2026-10-27). Host CSS variables and text classes re-declared below so the page runs standalone. Everything inside <body> is the widget code, verbatim. -->
<style>
:root{--text-primary:#1B1A17;--text-secondary:#5a574f;--text-muted:#a29d91;--bg:#fff;--surface-1:#f3f1ec;--radius:8px}
@media (prefers-color-scheme:dark){:root{--text-primary:#EDE6D6;--text-secondary:#b9b2a3;--text-muted:#6d685e;--bg:#1B1A18;--surface-1:#26241f}}
body{margin:0;padding:16px;max-width:640px;margin-inline:auto;background:var(--bg);color:var(--text-primary);font:14px/1.4 system-ui,sans-serif}
.th{font-size:14px;font-weight:500;fill:var(--text-primary)}
.ts{font-size:12px;fill:var(--text-secondary)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<h2 class="sr-only">Plan of a spoked-wheel stadium roof: outer compression ring, inner tension ring, sixteen radial cables; below, the force triangles of an outer and an inner ring node.</h2>
<svg width="100%" viewBox="0 0 380 385" role="img"><title>Spoked-wheel roof</title><desc>Outer ring red, inner ring and cables blue. Outer node: cable pull and two ring compressions. Inner node: cable pull and two ring tensions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g id="rf-g"></g>
<circle cx="190" cy="150" r="130" fill="none" stroke="#E24B4A" stroke-width="6"/>
<circle cx="190" cy="150" r="35" fill="none" stroke="#378ADD" stroke-width="3"/>
<g fill="none" stroke-width="2.5" marker-end="url(#arrow)">
<line x1="70" y1="300" x2="70" y2="324" stroke="#378ADD"/>
<line x1="70" y1="324" x2="130" y2="312" stroke="#E24B4A"/>
<line x1="130" y1="312" x2="70" y2="300" stroke="#E24B4A"/>
<line x1="250" y1="324" x2="250" y2="300" stroke="#378ADD"/>
<line x1="250" y1="300" x2="310" y2="312" stroke="#378ADD"/>
<line x1="310" y1="312" x2="250" y2="324" stroke="#378ADD"/>
</g>
<text class="th" x="100" y="352" text-anchor="middle">Outer ring node</text>
<text class="ts" x="100" y="370" text-anchor="middle">Ring pushes</text>
<text class="th" x="280" y="352" text-anchor="middle">Inner ring node</text>
<text class="ts" x="280" y="370" text-anchor="middle">Ring pulls</text>
</svg>
<script>
(function(){var NS="http://www.w3.org/2000/svg",g=document.getElementById('rf-g');
for(var k=0;k<16;k++){var a=k*22.5*Math.PI/180,l=document.createElementNS(NS,'line');
l.setAttribute('x1',(190+35*Math.cos(a)).toFixed(1));l.setAttribute('y1',(150+35*Math.sin(a)).toFixed(1));
l.setAttribute('x2',(190+130*Math.cos(a)).toFixed(1));l.setAttribute('y2',(150+130*Math.sin(a)).toFixed(1));
l.setAttribute('stroke','#378ADD');l.setAttribute('stroke-width','1.5');g.appendChild(l);}
})();
</script>
</body>
</html>
