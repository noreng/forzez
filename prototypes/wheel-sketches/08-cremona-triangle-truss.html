<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Cremona diagram: triangular truss</title>
<!-- Snapshot of an inline claude.ai chat widget (2026-10-27). Host CSS variables and text classes re-declared below so the page runs standalone. Everything inside <body> is the widget code, verbatim. -->
<style>
:root{--text-primary:#1B1A17;--text-secondary:#5a574f;--text-muted:#a29d91;--bg:#fff;--surface-1:#f3f1ec;--radius:8px}
@media (prefers-color-scheme:dark){:root{--text-primary:#EDE6D6;--text-secondary:#b9b2a3;--text-muted:#6d685e;--bg:#1B1A18;--surface-1:#26241f}}
body{margin:0;padding:16px;max-width:640px;margin-inline:auto;background:var(--bg);color:var(--text-primary);font:14px/1.4 system-ui,sans-serif}
.th{font-size:14px;font-weight:500;fill:var(--text-primary)}
.ts{font-size:12px;fill:var(--text-secondary)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<svg width="100%" viewBox="0 0 380 395" role="img"><title>Cremona diagram of a triangular truss</title><desc>Top: triangular truss with apex load and two support reactions. Bottom: its Cremona diagram — load line split by the reactions, rafter lines parallel to the rafters, tie line horizontal.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="70" y1="150" x2="190" y2="80.7" stroke="#E24B4A" stroke-width="5"/>
<line x1="190" y1="80.7" x2="310" y2="150" stroke="#E24B4A" stroke-width="5"/>
<line x1="70" y1="150" x2="310" y2="150" stroke="#378ADD" stroke-width="3"/>
<g fill="var(--surface-1)" stroke="var(--text-primary)" stroke-width="1.5"><circle cx="70" cy="150" r="4"/><circle cx="310" cy="150" r="4"/><circle cx="190" cy="80.7" r="4"/></g>
<line x1="190" y1="26" x2="190" y2="74" stroke="#EF9F27" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="70" y1="194" x2="70" y2="158" stroke="#EF9F27" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="310" y1="194" x2="310" y2="158" stroke="#EF9F27" stroke-width="3" marker-end="url(#arrow)"/>
<text class="ts" x="200" y="40">W</text>
<text class="ts" x="80" y="190">W/2</text>
<text class="ts" x="300" y="190" text-anchor="end">W/2</text>
<line x1="150" y1="215" x2="150" y2="355" stroke="#EF9F27" stroke-width="4"/>
<line x1="150" y1="215" x2="271.2" y2="285" stroke="#E24B4A" stroke-width="4"/>
<line x1="150" y1="355" x2="271.2" y2="285" stroke="#E24B4A" stroke-width="4"/>
<line x1="150" y1="285" x2="271.2" y2="285" stroke="#378ADD" stroke-width="3"/>
<text class="ts" x="140" y="289" text-anchor="end">load line</text>
<text class="ts" x="226" y="244">rafter = W</text>
<text class="ts" x="210" y="300">tie</text>
<text class="ts" x="190" y="385" text-anchor="middle">Each member drawn once</text>
</svg>
